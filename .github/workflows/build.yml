name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # build.bat kendi vcvars64 yolunu vswhere ile buluyor; ek bir adım gerekmez.
      - name: build.bat (cl + /MT, iki calistirilabilir)
        run: cmd /c build.bat

      - name: CMake + ctest
        run: |
          cmake -S . -B build_cmake -G "Visual Studio 17 2022"
          cmake --build build_cmake --config Release
          ctest --build-config Release --test-dir build_cmake

      - name: Unit testleri (kenar seridi hesabi)
        run: cmd /c tests\run_tests.bat

      # README'deki "vitrin disarida tek bir API birakmiyor" iddiasi burada
      # olculur: her public sembol demo.cpp veya shell.cpp'de gecmek zorunda.
      - name: Vitrin kapsama kapisi
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check_showcase.ps1

      # BOM'suz .ps1'i PowerShell 5.1 ANSI okur; icinden uretilen yorum satirlari
      # bozuk dogar. Bu adim iki kez kodlanmis UTF-8'i derlemeden once yakalar.
      - name: Metin kodlama kapisi
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check_text_encoding.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tengri-theme-msvc
          path: |
            build/TengriApp.exe
            build/TengriThemePreview.exe
          if-no-files-found: error
